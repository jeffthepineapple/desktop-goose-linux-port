<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CppGoose for Linux</title>
  <desc id="desc">A white goose walking across a dark terminal desktop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10171d"/>
      <stop offset="0.58" stop-color="#192832"/>
      <stop offset="1" stop-color="#213740"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233640"/>
      <stop offset="1" stop-color="#17242b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05090b" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 290 C240 268 390 305 610 282 S965 265 1200 289 V360 H0Z" fill="#0c1216" opacity=".78"/>
  <g fill="#8dd7bf" opacity=".1">
    <circle cx="82" cy="72" r="3"/><circle cx="332" cy="46" r="2"/><circle cx="551" cy="84" r="3"/>
    <circle cx="707" cy="49" r="2"/><circle cx="1080" cy="76" r="3"/><circle cx="1150" cy="183" r="2"/>
  </g>

  <g transform="translate(66 56)">
    <text x="0" y="45" fill="#8dd7bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">DESKTOP COMPANION / LINUX</text>
    <text x="0" y="116" fill="#f7f3e8" font-family="Inter, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">CppGoose</text>
    <text x="2" y="157" fill="#bccbd0" font-family="Inter, Segoe UI, sans-serif" font-size="24">A small desktop menace for Wayland and X11.</text>

    <g transform="translate(0 194)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect width="425" height="54" rx="10" fill="url(#screen)" stroke="#45616d"/>
      <circle cx="21" cy="18" r="4" fill="#ff9f1c"/>
      <circle cx="35" cy="18" r="4" fill="#8dd7bf"/>
      <circle cx="49" cy="18" r="4" fill="#657b84"/>
      <text x="21" y="41" fill="#8dd7bf">goose&gt;</text>
      <text x="92" y="41" fill="#f7f3e8">force set 0 chase</text>
      <rect x="322" y="27" width="2" height="17" fill="#ff9f1c"/>
    </g>
  </g>

  <g transform="translate(800 38)" filter="url(#shadow)">
    <ellipse cx="177" cy="242" rx="142" ry="24" fill="#05090b" opacity=".38"/>
    <ellipse cx="151" cy="194" rx="98" ry="62" fill="#f7f3e8"/>
    <path d="M109 185 C93 136 104 88 145 55" fill="none" stroke="#f7f3e8" stroke-width="48" stroke-linecap="round"/>
    <circle cx="151" cy="48" r="35" fill="#f7f3e8"/>
    <path d="M177 45 L235 60 L178 70Z" fill="#ff9f1c"/>
    <circle cx="162" cy="38" r="5" fill="#11181d"/>
    <path d="M93 190 C127 177 156 184 184 214 C143 229 112 221 93 190Z" fill="#dce4df"/>
    <path d="M120 242 L115 282 M185 243 L198 281" stroke="#ff9f1c" stroke-width="9" stroke-linecap="round"/>
    <path d="M99 283 H132 M181 282 H215" stroke="#ff9f1c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g fill="#52656a" opacity=".78" transform="translate(675 284) rotate(-8)">
    <ellipse cx="0" cy="0" rx="9" ry="15"/><circle cx="-10" cy="-13" r="4"/><circle cx="0" cy="-17" r="4"/><circle cx="10" cy="-13" r="4"/>
    <g transform="translate(-61 17) rotate(-12)"><ellipse rx="8" ry="14"/><circle cx="-9" cy="-12" r="4"/><circle cy="-16" r="4"/><circle cx="9" cy="-12" r="4"/></g>
    <g transform="translate(-124 8) rotate(9)"><ellipse rx="7" ry="13"/><circle cx="-8" cy="-11" r="3.5"/><circle cy="-15" r="3.5"/><circle cx="8" cy="-11" r="3.5"/></g>
  </g>
</svg>
