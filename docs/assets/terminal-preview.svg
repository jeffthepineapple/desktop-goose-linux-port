<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">CppGoose interactive terminal</title>
  <desc id="desc">An example shell session showing autocomplete, force behavior, and Perlin personality traits.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2c34"/>
      <stop offset="1" stop-color="#111a20"/>
    </linearGradient>
    <filter id="drop"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="500" rx="24" fill="#dfe8e3"/>
  <g transform="translate(52 42)" filter="url(#drop)">
    <rect width="1096" height="416" rx="15" fill="url(#panel)"/>
    <rect width="1096" height="48" rx="15" fill="#263a44"/>
    <rect y="34" width="1096" height="14" fill="#263a44"/>
    <circle cx="25" cy="24" r="6" fill="#ff7b6b"/><circle cx="47" cy="24" r="6" fill="#ffbd53"/><circle cx="69" cy="24" r="6" fill="#8dd7bf"/>
    <text x="548" y="30" text-anchor="middle" fill="#9fb1b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">CppGoose control shell</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <text x="28" y="87" fill="#8dd7bf">goose&gt;</text><text x="116" y="87" fill="#f7f3e8">spawn Pip</text>
      <text x="28" y="121" fill="#8dd7bf">[ok]</text><text x="90" y="121" fill="#bccbd0">id=1</text>

      <text x="28" y="169" fill="#8dd7bf">goose&gt;</text><text x="116" y="169" fill="#f7f3e8">force set 1 cha</text>
      <rect x="303" y="151" width="78" height="25" rx="5" fill="#ff9f1c" opacity=".2"/>
      <text x="311" y="169" fill="#ffb13b">chase</text>
      <text x="394" y="169" fill="#738991">TAB</text>
      <text x="28" y="203" fill="#8dd7bf">[ok]</text><text x="90" y="203" fill="#bccbd0">goose_id=1 behavior=chase</text>

      <text x="28" y="251" fill="#8dd7bf">goose&gt;</text><text x="116" y="251" fill="#f7f3e8">status</text>
      <text x="28" y="289" fill="#ff9f1c" font-weight="700">FLOCK MANIFEST</text>
      <text x="28" y="323" fill="#71878f">ID   NAME                 SKIN          STATE</text>
      <text x="28" y="357" fill="#f7f3e8">#0   Goose                classic       wander</text>
      <text x="28" y="389" fill="#8fa2a8">     traits attack:18  meme:42  note:27  seed:948104...</text>
      <text x="600" y="357" fill="#f7f3e8">#1   Pip                  party         chase</text>
      <text x="600" y="389" fill="#8fa2a8">     traits attack:39  meme:21  note:14  seed:173552...</text>
    </g>
  </g>
</svg>
